# =============================================================================
# dev｜开发(development)：oidc(连本地 Keycloak)；cors 全开；cookie 非 https；
# @Profile("dev") 的 seeder 全开。连接值与 prod/test 一样走环境变量——
# 本地值见 backend/.env.dev（交给 IDE 运行配置加载）。
# 启动：-Dspring-boot.run.profiles=dev 或 SPRING_PROFILES_ACTIVE=dev。
# 只覆盖与 base(application.yml) 不同的键。
# =============================================================================
spring:
  datasource:
    url: ${CORE_DB_URL}
    username: ${CORE_DB_USERNAME}
    password: ${CORE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${CORE_REDIS_HOST}
      port: ${CORE_REDIS_PORT:6379}
      password: ${CORE_REDIS_PASSWORD:}
      database: ${CORE_REDIS_DB:0}
  mail:
    username: ${CORE_MAIL_USERNAME:}    # ExMail 完整邮箱地址；留空则发信不可用
    password: ${CORE_MAIL_PASSWORD:}    # ExMail 客户端专用密码

app:
  security:
    mode: oidc                          # 连本地 Keycloak(infra/keycloak)；裸跑无 IdP 时可临时改 permit-all
    refresh-cookie:
      secure: false                     # 本地走 http，故 false(生产为 true)
      same-site: Lax                    # 本地跨端口，故 Lax(生产为 Strict)
  mybatis:
    tenant:
      enabled: true                     # 显式开，避免历史上误继承 false 致跨租户可见
  mail:
    enabled:   ${CORE_MAIL_ENABLED:true}    # 默认 true=真发(需配好 CORE_MAIL_*)；设 false 则只打日志
    from:      ${CORE_MAIL_FROM:}            # 与 username 对齐(ExMail 要求)
    from-name: ${CORE_MAIL_FROM_NAME:Access Matrix (dev)}
    base-url:  ${CORE_APP_BASE_URL:http://localhost:5273}
  cors:
    allowed-origins:
      - "*"                             # 本地全开；生产绝不可用
  debug:
    expose-error-details: true          # 本地排错；生产为 false
