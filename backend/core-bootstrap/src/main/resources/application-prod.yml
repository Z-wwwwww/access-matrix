# =============================================================================
# prod｜生产(production)：oidc 鉴权；连接/密钥走环境变量；关 Swagger；收紧 actuator。
# 必填环境变量及「本地|上线」取值见 backend/.env.example。只覆盖与 base(application.yml) 不同的键。
# =============================================================================
spring:
  datasource:
    url: ${CORE_DB_URL}                 # 无默认→必填，如 jdbc:postgresql://host:5432/db
    username: ${CORE_DB_USERNAME}       # 无默认→必填
    password: ${CORE_DB_PASSWORD}       # 无默认→必填
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${CORE_REDIS_HOST}
      port: ${CORE_REDIS_PORT:6379}
      password: ${CORE_REDIS_PASSWORD:} # 留空=无密码连接；生产建议设强密码
      database: ${CORE_REDIS_DB:0}
      ssl:
        enabled: true                   # true=TLS 连 Redis(生产)；无 TLS 的 Redis 需改 false
  freemarker:
    cache: true                         # 生产缓存编译后的模板（dev 为 false，便于改模板免重启）
  flyway:
    repair-on-migrate: false            # 生产不自动 repair：校验和不符即启动失败，暴露被改过/漂移的历史迁移

app:
  security:
    mode: oidc                          # 生产钉死 oidc；回退 legacy 用 APP_SECURITY_MODE=jwt + CORE_JWT_SECRET
    oidc:
      issuer-base-uri: ${CORE_OIDC_ISSUER_BASE_URI}   # Keycloak 根地址(一租户一 realm)
  keycloak:
    admin:
      server-url:    ${CORE_KEYCLOAK_SERVER_URL}
      client-secret: ${CORE_KEYCLOAK_PROVISIONER_SECRET}   # 强值；base 注释说明它是推进 KC 的
    bootstrap:
      # 稳态 false；仅首次部署临时设 CORE_KEYCLOAK_BOOTSTRAP_ENABLED=true 引导 provisioner 客户端，成功后改回。
      enabled: ${CORE_KEYCLOAK_BOOTSTRAP_ENABLED:false}
  mybatis:
    tenant:
      enabled: true                     # 生产必须：租户行级隔离
  cors:
    allowed-origins: ${CORE_CORS_ALLOWED_ORIGINS}   # 明确白名单(逗号分隔)，勿用 "*"
  debug:
    expose-error-details: false         # 生产必须 false

springdoc:
  api-docs:
    enabled: false                      # 生产关闭，不暴露接口清单
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches   # 去掉可写的 loggers
