<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Gold "matrix" brand mark: outer frame rotated 15° clockwise, inner
       square upright. Kept in sync with the Keycloak login theme
       (infra/keycloak/themes/access-matrix/login: favicon.ico + the
       wordmark glyph in access-matrix.css). -->
  <g transform="translate(12 12)">
    <rect x="-9" y="-9" width="18" height="18" fill="none" stroke="#C9A875" stroke-width="1.6" transform="rotate(15)"/>
    <rect x="-4.5" y="-4.5" width="9" height="9" fill="#C9A875"/>
  </g>
</svg>
