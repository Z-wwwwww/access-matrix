<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Gold "matrix" brand mark only (no wordmark): outer frame rotated 15°
       clockwise, inner square upright. The wordmark is rendered by the
       component next to this so its color can follow the theme. Kept in sync
       with the favicon and the Keycloak login theme glyph. -->
  <g transform="translate(16 16)">
    <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="#C9A875" stroke-width="2.1" transform="rotate(15)"/>
    <rect x="-6" y="-6" width="12" height="12" fill="#C9A875"/>
  </g>
</svg>
