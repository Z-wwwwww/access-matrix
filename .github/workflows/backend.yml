name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      # The backend BUILD reaches outside backend/: core-infrastructure's pom
      # puts infra/keycloak/realms/demo-realm.json on the main classpath (the
      # new-tenant realm-clone template) and core-bootstrap's puts it on the test
      # classpath. KeycloakRealmTemplateTest asserts on its contents — brute-force
      # detection, PKCE enforcement. Without this path, editing only that JSON runs
      # NO backend job, so those security guards can be removed with a green CI.
      # e2e.yml already watches infra/keycloak/**; this is the same dependency.
      - 'infra/keycloak/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/keycloak/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: compile + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw -B -DskipTests -ntp compile

      - name: Test
        run: ./mvnw -B -ntp test
