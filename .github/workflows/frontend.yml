name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 26
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Vitest unit tests (src/**/*.test.js + tests/components/**). These are the
      # frontend counterpart of backend.yml's `mvnw test` and several of them exist
      # purely as regression guards (e.g. tests/components/buttonGating.test.js pins
      # the permission codes gating the admin pages' write buttons), so they have to
      # gate a PR — otherwise a rename silently lands on main.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
